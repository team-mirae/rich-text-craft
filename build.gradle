plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "richtextcraft"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"richtextcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		showStandardStreams = true
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	// Minecraft 26.x runs on Java 25. A toolchain keeps the build independent of the daemon's JVM.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_richtextcraft" }
	}
}

// In-game tests: boots the real client and injects SDL text events into each widget
// (./gradlew runClientGameTest). Lives in src/gametest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "richtextcraft-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
